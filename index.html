<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마니또 결과 공개</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(180deg,#fff7f4,#ffeef4);
  font-family:Arial,"Apple SD Gothic Neo",sans-serif;
  color:#2d2528;
}

.wrap{
  max-width:560px;
  margin:auto;
  padding:24px 16px 80px;
}

.hero{
  background:white;
  border-radius:28px;
  padding:28px 22px;
  text-align:center;
  box-shadow:0 10px 30px rgba(255,120,160,.15);
}

.badge{
  display:inline-block;
  padding:8px 16px;
  border-radius:999px;
  background:#ffe7ef;
  color:#ff4d79;
  font-size:13px;
  font-weight:900;
  margin-bottom:10px;
}

h1{
  margin:0;
  font-size:34px;
  color:#ff4d79;
}

.desc{
  margin-top:10px;
  color:#7d6c74;
  line-height:1.5;
  font-size:14px;
}

.section{
  margin-top:28px;
}

.section-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:12px;
}

.name-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.name-btn{
  border:none;
  border-radius:18px;
  padding:16px 10px;
  background:white;
  color:#2d2528;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 6px 0 #ffd5df;
}

.name-btn:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #ffd5df;
}

.card{
  display:none;
  margin-top:20px;
  background:white;
  border-radius:28px;
  padding:24px 18px;
  box-shadow:0 10px 25px rgba(255,120,160,.14);
}

.card-name{
  font-size:28px;
  font-weight:900;
  color:#ff4d79;
  text-align:center;
  margin-bottom:16px;
}

.line{
  background:#fff5f8;
  border-radius:18px;
  padding:18px 20px;
  margin:12px 0;
  font-size:16px;
  line-height:1.8;
  word-break:keep-all;
  white-space:normal;
}

.reason{

  background:#fffaf2;

  border:1px dashed #ffc46b;

  color:#6f563f;

  border-radius:18px;

  padding:22px;

  margin-top:14px;

  min-height:auto;

  max-height:none;

  overflow:visible;

  font-size:15px;

  line-height:2;

  text-align:left;

  word-break:break-word;

  white-space:pre-wrap;

}

.result{
  margin-top:18px;
  text-align:center;
  font-size:30px;
  font-weight:900;
}

.success{
  color:#ff4d79;
}

.fail{
  color:#7a839d;
}

.all-btn{
  width:100%;
  margin-top:18px;
  border:none;
  border-radius:20px;
  padding:18px;
  background:#ff4d79;
  color:white;
  font-size:17px;
  font-weight:900;
  box-shadow:0 6px 0 #d82d58;
}

.all-list{
  display:none;
  margin-top:22px;
}

.all-card{
  background:white;
  border-radius:24px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 8px 22px rgba(255,120,160,.13);
}

.all-name{
  font-size:21px;
  font-weight:900;
  color:#ff4d79;
  margin-bottom:8px;
}

.all-main{
  line-height:1.7;
  font-size:15px;
}

.all-reason{
  margin-top:10px;
  background:#fffaf2;
  border-radius:14px;
  padding:16px;
  color:#6f563f;
  font-size:14px;
  line-height:1.8;
  white-space:pre-wrap;
}

@media(max-width:370px){

  .name-grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div class="wrap">

  <div class="hero">

    <div class="badge">
      MANITO RESULT
    </div>

    <h1>
      🎁 마니또 결과 공개
    </h1>

    <div class="desc">
      이름을 누르면 바로 결과를 확인할 수 있어요 💕
    </div>

  </div>

  <div class="section">

    <div class="section-title">
      이름 선택
    </div>

    <div id="grid" class="name-grid"></div>

  </div>

  <div id="card" class="card"></div>

  <button class="all-btn" onclick="showAll()">
    전체 결과 한눈에 보기
  </button>

  <div id="allList" class="all-list"></div>

</div>

<script>

const pairs = {

  "배주성":"배서영",
  "이서령":"차나영",
  "김윤채":"송건호",
  "김미성":"정다은",
  "송건호":"김가은",
  "박찬유":"김수련",
  "김수련":"배주성",
  "양윤정":"이서령",
  "김소윤":"신성훈",
  "신성훈":"김소윤",
  "장병재":"구윤지",
  "배서영":"장병재",
  "여지원":"김미성",
  "김가은":"김윤채",
  "차나영":"양윤정",
  "정다은":"여지원",
  "구윤지":"박찬유"

};

const data = [

{
name:"김소윤",
guess:"김미성",
reason:"말투가 비슷하다."
},

{
name:"김수련",
guess:"모름",
reason:"진짜로 모르겠다"
},

{
name:"이서령",
guess:"장병재",
reason:"원래 병재님 아니면 성훈님일 것 같다 생각했었고 살짝 성훈님일 것 같다고 생각했는데 아무리 생각해도 뭔가 성훈님이라면 할 수 없는 멘트들이라서 병재님일 것 같앗음. 그리고 99카페 컵홀더 닉네임부터 먼가 성훈님깔은 아닌 것 같았음. 근데 먼가 병재님 깔도 아니긴함. 닉네임과 멘트들 먼가 주성님 깔이긴 한데 글 내용 보니까 주성님은 아니라 살짝 혼란이엇음 아무튼 모르겠음"
},

{
name:"배주성",
guess:"차나영",
reason:"감이에여!!!"
},

{
name:"차나영",
guess:"송건호",
reason:"모루게떠염ㅜㅜㅜ 나 잘 챙겨주는 서람 없는데.. 서영주성인데 제가 그 둘의 마니또를 아라염ㅜㅜㅜㅠ히유ㅠ"
},

{
name:"송건호",
guess:"김가은",
reason:"술 먹어본적 있다고 해서"
},

{
name:"양윤정",
guess:"모름",
reason:"성별은 여자분이신 것 같은데 그것 말곤 진짜 모르겠어요😂😂"
},

{
name:"정다은",
guess:"김미성",
reason:"엠티 때 계속 도와줌!!😇"
},

{
name:"배서영",
guess:"장병재",
reason:`말투에서 느껴짐 저 장병재예요~~~하고…
그리고 새벽에 뭘 너무 많이 먹어요 진짜 많이 먹어요…
그리고 나한테 이정도로 장난칠 수 있는 아이가 몇 없음…
늑구여서 행복했다…
늑구여서 좋았다…
모든 순간이 웃겼다…
이번 마니또방 씬스틸러로 인정합니다.
늑구야 오래오래 행복해야 한다~!`
},

{
name:"박찬유",
guess:"김수련",
reason:"감"
},

{
name:"장병재",
guess:"김소윤",
reason:"일단 엄청 친하진 않은 07년생 여자 같았습니다. 동갑이나 형누나들이였으면 뭔가 티가 났을것 같습니다.. 윤채 아니면 소윤이 둘중에 제 마니또가 있지 않을까요"
},

{
name:"신성훈",
guess:"김소윤",
reason:"글씨를 못쓴다"
},

{
name:"김윤채",
guess:"차나영",
reason:"느낌이 왓어용"
},

{
name:"여지원",
guess:"모름",
reason:"진짜로 모르겠어요.. ㅠㅠ 죄송합니다"
},

{
name:"김가은",
guess:"김윤채",
reason:"엠티 때 술게임 알려주고 흑기사 해주겠다면서 챙겨줬다"
},

{
name:"구윤지",
guess:"배서영",
reason:"경영학부 출신 아닌 사람 서영언니밖에 없는 것 같은데?? 원래부터 경영인 사람이 퀴즈로 그런 문항 낼 리가 없다.. 근데 말투가 넘 다른 것 같아서 아닌 것 같기도 해요 6주 동안 꼬박꼬박 챙겨주셔서 감사했어요💕💕"
},

{
name:"김미성",
guess:"차나영",
reason:"미성씨라고 호칭하셨으니까 적어도 나보다 어리진 않으실 것 같고 마니또 시작하기 전부터 알았던 사람들 중에 한 명일 것 같았다. 그리고 안경쓰시고 mt도 갔으니까 마니또일 수 있겠다고 생각했다."
}

];

const grid = document.getElementById("grid");
const card = document.getElementById("card");
const allList = document.getElementById("allList");

data.forEach((p,i)=>{

  const btn = document.createElement("button");

  btn.className = "name-btn";

  btn.innerText = p.name;

  btn.onclick = ()=>showPerson(i);

  grid.appendChild(btn);

});

function showPerson(i){

  allList.style.display = "none";

  const p = data[i];

  const actual = pairs[p.name];

  const success = p.guess === actual;

  card.style.display = "block";

  card.innerHTML = `
  
    <div class="card-name">
      ${p.name}
    </div>

    <div class="line">
      예측: <b>${p.guess}</b>
    </div>

    <div class="line reason">
💭 ${p.reason}
    </div>

    <div class="line">
      실제 마니또: <b>${actual}</b>
    </div>

    <div class="result ${success ? "success" : "fail"}">
      ${success ? "성공 🎉" : "실패 💔"}
    </div>

  `;

}

function showAll(){

  card.style.display = "none";

  allList.style.display = "block";

  let html = "";

  data.forEach(p=>{

    const actual = pairs[p.name];

    const success = p.guess === actual;

    html += `
    
      <div class="all-card">

        <div class="all-name">
          ${p.name} ${success ? "🎉" : "💔"}
        </div>

        <div class="all-main">
          ${p.name} → 예측 <b>${p.guess}</b> / 실제 <b>${actual}</b> / <b>${success ? "성공" : "실패"}</b>
        </div>

        <div class="all-reason">
💭 ${p.reason}
        </div>

      </div>

    `;

  });

  allList.innerHTML = html;

}

</script>

</body>
</html>
